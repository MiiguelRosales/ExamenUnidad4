<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIE Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 300px;
            height: 200px;
            background: #243137;
            position: relative;
            display: grid;
            place-content: center;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
            cursor: pointer;
        }

        .border {
            position: absolute;
            inset: 0px;
            border: 2px solid #0066FF;
            opacity: 0;
            transform: rotate(10deg);
            transition: all 0.5s ease-in-out;
        }

        .bottom-text {
            position: absolute;
            left: 50%;
            bottom: 13px;
            transform: translateX(-50%);
            font-size: 12px;
            text-transform: uppercase;
            padding: 0px 5px 0px 8px;
            color: #0066FF;
            background: #243137;
            opacity: 0;
            letter-spacing: 2px;
            transition: all 0.5s ease-in-out;
        }

        .content {
            transition: all 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .logo-text {
            font-size: 48px;
            font-weight: bold;
            color: #0066FF;
            transition: all 1s ease-in-out;
            letter-spacing: 8px;
        }

        .expanded-text {
            font-size: 16px;
            color: #0066FF;
            margin-top: 15px;
            opacity: 0;
            transition: all 0.5s ease-in-out 0.3s;
            max-width: 280px;
            line-height: 1.3;
        }

        .card.expanded {
            border-radius: 0;
            transform: scale(1.1);
        }

        .card.expanded .logo-text {
            font-size: 28px;
            letter-spacing: 4px;
        }

        .card.expanded .expanded-text {
            opacity: 1;
        }

        .card.expanded .border {
            inset: 15px;
            opacity: 1;
            transform: rotate(0);
        }

        .card.expanded .bottom-text {
            letter-spacing: 2px;
            opacity: 1;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="card" id="sieCard">
        <div class="border"></div>
        <div class="content">
            <div class="logo-text">SIE</div>
            <div class="expanded-text">Sistema de Integración Escolar</div>
        </div>
        <span class="bottom-text">ISC 8</span>
    </div>

    <script>
        // Auto-expand la tarjeta al cargar
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('sieCard').classList.add('expanded');
            }, 500);
        });

        // Permitir toggle al tocar/hacer click
        document.getElementById('sieCard').addEventListener('click', function() {
            this.classList.toggle('expanded');
        });
    </script>
</body>
</html>
